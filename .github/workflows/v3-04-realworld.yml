name: "T2 v3 04 - Real World gate"
on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        required: true
        type: string
        description: "Finished validation result run id"
permissions:
  contents: read
  actions: read
jobs:
  verify-realworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require frozen v3 candidates and validation handoff
        run: |
          echo "Real World samples use independent dataset-id/depth keys, n=200/1000."
          test -f artifacts/v3_realworld_inputs_verified.json || { echo "Missing frozen v3 weights and independent validation handoff; refusing to score"; exit 1; }
