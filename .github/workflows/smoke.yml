name: Verification
on:
  workflow_dispatch:
  push:
    paths: ['R/**','tests/**','scripts/**','.github/workflows/smoke.yml']
permissions:
  contents: read
jobs:
  modular:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages("statmod", repos="https://cloud.r-project.org")'
      - run: Rscript tests/test_checkpoint_contract.R
      - run: Rscript tests/test_v4_integration.R
      - run: Rscript scripts/run_all_smoke.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-checkpoints
          path: runtime/integration_smoke/
          retention-days: 14
