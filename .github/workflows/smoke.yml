name: Verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      resume_run_id:
        description: 'Previous Verification run ID to restore completed stage artifacts'
        required: false
        default: ''
        type: string

permissions:
  packages: read
  contents: read
  actions: read

jobs:
  preflight:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'full' || inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_checkpoint_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_artifact_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_artifact_size_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_common_pipeline.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_smoke.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_v3_design.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_v4_integration.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_historical_mc_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_engine_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_realworld_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_resume_contract.R
      - run: bash scripts/run_r_in_container.sh Rscript tests/test_canonical_mc_contract.R

  smoke:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [normal]
        seed: [0]
        engine: [all]
    env:
      T2_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && '1' || '0' }}
      T2_ALLOW_LEGACY_CHECKPOINT_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && '1' || '0' }}
      SHARD: ${{ matrix.family }}_${{ matrix.engine }}_seed${{ matrix.seed }}
      T2_OUTPUT_ROOT: artifacts/ci
      T2_REALWORLD_MANIFEST: config/public_datasets_smoke.csv
      T2_REALWORLD_REPS: '20'
      T2_REALWORLD_SAMPLE_SIZES: '200'
      T2_MATRIX_FORMAT: rds
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
      - name: Restore prior shard artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/
      - name: Run datasets
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R datasets "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run mc_validation
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R mc_validation "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run montecarlo
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R montecarlo "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run discovery
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R discovery "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run heldout
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R heldout "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run realworld
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R realworld "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run stress
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R stress "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run aggregate
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R aggregate "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  shared-validation:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      T2_OUTPUT_ROOT: artifacts/ci
      T2_REALWORLD_REPS: '500'
      T2_REALWORLD_SAMPLE_SIZES: '200,1000,3000'
      T2_REALWORLD_BUNDLE: artifacts/ci/shared/realworld_bundle.rds
      T2_MATRIX_FORMAT: rds
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore prior shared validation artifact
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: shared-validation
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/shared/
        if: inputs.resume_run_id == ''
        with:
          r-version: '4.3.3'
          use-public-rspm: true
        if: inputs.resume_run_id == ''
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
        if: inputs.resume_run_id == ''
      - name: Validate restored shared validation artifact
        if: inputs.resume_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/ci/shared/datasets/results/datasets.rds
          test -s artifacts/ci/shared/mc_validation/results/mc_validation.rds
          test -s artifacts/ci/shared/realworld_bundle.rds
          echo "RESTORED SHARED VALIDATION PASS"
      - name: Build shared dataset certification
        if: inputs.resume_run_id == ''
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R datasets shared full normal 0 all
      - name: Build shared Monte Carlo validation certification
        if: inputs.resume_run_id == ''
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R mc_validation shared full normal 0 all
      - name: Build canonical prepared real-world bundle
        if: inputs.resume_run_id == ''
        run: bash scripts/run_r_in_container.sh Rscript scripts/build_realworld_bundle.R full
      - uses: actions/upload-artifact@v4
        with:
          name: shared-validation
          path: artifacts/ci/shared/
          if-no-files-found: error
          retention-days: 30

  precomputed-montecarlo:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
    env:
      T2_ZENODO_RECORD_ID: '23543077'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore prior precomputed family artifact
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: mc-precomputed-${{ matrix.family }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/mc_canonical/
        if: inputs.resume_run_id == ''
        with:
          r-version: '4.3.3'
          use-public-rspm: true
        if: inputs.resume_run_id == ''
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
        if: inputs.resume_run_id == ''
      - name: Download public Monte Carlo package
        if: inputs.resume_run_id == ''
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          base="https://zenodo.org/records/${T2_ZENODO_RECORD_ID}/files"
          mkdir -p artifacts/mc_canonical
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "$base/SHA256SUMS?download=1" \
            --output artifacts/mc_canonical/SHA256SUMS
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "$base/t2_mc_v2_${FAMILY}.tar?download=1" \
            --output "artifacts/mc_canonical/t2_mc_v2_${FAMILY}.tar"
      - name: Verify package checksum and extract
        if: inputs.resume_run_id == ''
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          cd artifacts/mc_canonical
          grep " t2_mc_v2_${FAMILY}.tar$" SHA256SUMS | sha256sum -c -
          mkdir extracted
          tar -xf "t2_mc_v2_${FAMILY}.tar" -C extracted
          rm "t2_mc_v2_${FAMILY}.tar"
          shopt -s dotglob
          mv extracted/* .
          rmdir extracted
      - name: Validate complete family package
        if: inputs.resume_run_id == ''
        env:
          FAMILY: ${{ matrix.family }}
        run: bash scripts/run_r_in_container.sh Rscript scripts/verify_precomputed_mc.R artifacts/mc_canonical "$FAMILY"
      - name: Validate restored family package
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          root=artifacts/mc_canonical/v2_shared_base_crn/full/${FAMILY}
          test "$(find "$root" -type f -name '*.rds' | wc -l)" -eq 12
          test -s "$root/seed00/n1000_r500.rds"
          test -s "$root/seed08/n200_r500.rds"
          test -s "$root/seed08/n1000_r250.rds"
          echo "RESTORED PRECOMPUTED MC PASS $FAMILY"
      - uses: actions/upload-artifact@v4
        with:
          name: mc-precomputed-${{ matrix.family }}
          path: artifacts/mc_canonical/
          if-no-files-found: error
          retention-days: 30

  backup-preflight:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.resume_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T2_BACKUP_HOST: ${{ vars.T2_BACKUP_HOST }}
      T2_BACKUP_USER: ${{ vars.T2_BACKUP_USER }}
      T2_BACKUP_ROOT: ${{ vars.T2_BACKUP_ROOT }}
      T2_BACKUP_SSH_KEY: ${{ secrets.T2_BACKUP_SSH_KEY }}
      T2_BACKUP_KNOWN_HOSTS: ${{ secrets.T2_BACKUP_KNOWN_HOSTS }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in T2_BACKUP_HOST T2_BACKUP_USER T2_BACKUP_ROOT T2_BACKUP_SSH_KEY T2_BACKUP_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            [[ -n "${!name:-}" ]] || { echo "Missing Actions backup setting: $name" >&2; exit 2; }
          done
          [[ "$T2_BACKUP_ROOT" == /* && "$T2_BACKUP_ROOT" != *..* ]] || { echo "Invalid T2_BACKUP_ROOT" >&2; exit 2; }
          echo "BACKUP PREFLIGHT PASS: cloud jobs have a configured local-backup route"

  full:
    needs: [preflight, shared-validation, backup-preflight, precomputed-montecarlo]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && (inputs.resume_run_id != '' || (needs.preflight.result == 'success' && needs.shared-validation.result == 'success' && needs.backup-preflight.result == 'success' && needs.precomputed-montecarlo.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
        engine: [ga, nsga2, de, dirichlet]
        seed: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      T2_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && '1' || '0' }}
      SHARD: ${{ matrix.family }}_${{ matrix.engine }}_seed${{ matrix.seed }}
      T2_OUTPUT_ROOT: artifacts/ci
      T2_CANONICAL_MC_ROOT: artifacts/mc_canonical
      T2_SHARED_SHARD: shared
      T2_REALWORLD_BUNDLE: artifacts/ci/shared/realworld_bundle.rds
      T2_REQUIRE_CANONICAL_STRESS: '1'
      T2_BACKUP_HOST: ${{ vars.T2_BACKUP_HOST }}
      T2_BACKUP_USER: ${{ vars.T2_BACKUP_USER }}
      T2_BACKUP_ROOT: ${{ vars.T2_BACKUP_ROOT }}
      T2_BACKUP_SSH_KEY: ${{ secrets.T2_BACKUP_SSH_KEY }}
      T2_BACKUP_KNOWN_HOSTS: ${{ secrets.T2_BACKUP_KNOWN_HOSTS }}
      T2_CHECKPOINT_TRANSFER_SECONDS: '900'
      T2_MATRIX_FORMAT: rds
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore precomputed Monte Carlo family package from current run
        if: inputs.resume_run_id == ''
        uses: actions/download-artifact@v5
        with:
          name: mc-precomputed-${{ matrix.family }}
          path: artifacts/mc_canonical/
      - name: Restore precomputed Monte Carlo family package from prior run
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: mc-precomputed-${{ matrix.family }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/mc_canonical/
      - name: Restore shared validations and prepared real-world bundle from current run
        if: inputs.resume_run_id == ''
        uses: actions/download-artifact@v5
        with:
          name: shared-validation
          path: artifacts/ci/shared/
      - name: Restore shared validations and prepared real-world bundle from prior run
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: shared-validation
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/shared/
      - name: Connect runner to private backup network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure verified SSH backup endpoint
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$T2_BACKUP_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$T2_BACKUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$T2_BACKUP_USER@$T2_BACKUP_HOST" true
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
      - name: Restore prior final shard artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-final"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/
      - name: Restore prior Monte Carlo stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-montecarlo"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/montecarlo/
      - name: Restore prior discovery stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-discovery"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/discovery/
      - name: Restore prior held-out stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-heldout"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/heldout/
      - name: Restore prior real-world stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-realworld"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/realworld/
      - name: Restore prior stress stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-stress"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/stress/
      - name: Restore prior aggregate stage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-aggregate"
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/${{ env.SHARD }}/aggregate/
      - name: Restore newest verified local-backup snapshot
        if: env.T2_RESUME == '1'
        continue-on-error: true
        shell: bash
        run: |
          T2_OUTPUT_ROOT=artifacts/ci scripts/checkpoint_transfer.sh pull "$SHARD" || \
            echo "No usable local snapshot; continuing with Actions artifact recovery"
      - name: Start checkpoint backup loop
        shell: bash
        run: |
          nohup scripts/checkpoint_sync_loop.sh "$SHARD" > checkpoint-sync.log 2>&1 &
          echo $! > checkpoint-sync.pid
      - name: Run montecarlo
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R montecarlo "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-montecarlo"
          path: artifacts/ci/${{ env.SHARD }}/montecarlo/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run discovery
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R discovery "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-discovery"
          path: artifacts/ci/${{ env.SHARD }}/discovery/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run heldout
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R heldout "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-heldout"
          path: artifacts/ci/${{ env.SHARD }}/heldout/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run realworld
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R realworld "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-realworld"
          path: artifacts/ci/${{ env.SHARD }}/realworld/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run stress
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R stress "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-stress"
          path: artifacts/ci/${{ env.SHARD }}/stress/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run aggregate
        run: bash scripts/run_r_in_container.sh Rscript scripts/run_stage.R aggregate "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-aggregate"
          path: artifacts/ci/${{ env.SHARD }}/aggregate/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Stop checkpoint backup loop and publish final snapshot
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f checkpoint-sync.pid ]]; then
            kill "$(cat checkpoint-sync.pid)" 2>/dev/null || true
            wait "$(cat checkpoint-sync.pid)" 2>/dev/null || true
          fi
          scripts/checkpoint_transfer.sh push "$SHARD" || echo "Final backup transfer failed; inspect checkpoint-sync.log"
          rm -f checkpoint-sync.pid
      - name: Publish final shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}-final"
          path: artifacts/ci/${{ env.SHARD }}/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
