name: Verification

on:
  push:
    paths: ['R/**', 'tests/**', 'scripts/**', 'config/**', '.github/workflows/smoke.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      resume_run_id:
        description: 'Previous Verification run ID to restore completed stage artifacts'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - run: Rscript scripts/check_environment.R
      - run: Rscript tests/test_checkpoint_contract.R
      - run: Rscript tests/test_artifact_contract.R
      - run: Rscript tests/test_artifact_size_contract.R
      - run: Rscript tests/test_common_pipeline.R
      - run: Rscript tests/test_smoke.R
      - run: Rscript tests/test_v3_design.R
      - run: Rscript tests/test_v4_integration.R
      - run: Rscript tests/test_historical_mc_contract.R
      - run: Rscript tests/test_engine_contract.R
      - run: Rscript tests/test_realworld_contract.R
      - run: Rscript tests/test_resume_contract.R

  smoke:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [normal]
        seed: [0]
        engine: [all]
    env:
      T2_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && '1' || '0' }}
      SHARD: ${{ matrix.family }}_${{ matrix.engine }}_seed${{ matrix.seed }}
      T2_OUTPUT_ROOT: artifacts/ci
      T2_REALWORLD_MANIFEST: config/public_datasets_smoke.csv
      T2_REALWORLD_REPS: '20'
      T2_REALWORLD_SAMPLE_SIZES: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - run: Rscript scripts/check_environment.R
      - name: Restore prior shard artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/
      - name: Run datasets
        run: Rscript scripts/run_stage.R datasets "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run mc_validation
        run: Rscript scripts/run_stage.R mc_validation "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run montecarlo
        run: Rscript scripts/run_stage.R montecarlo "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run discovery
        run: Rscript scripts/run_stage.R discovery "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run heldout
        run: Rscript scripts/run_stage.R heldout "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run realworld
        run: Rscript scripts/run_stage.R realworld "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run stress
        run: Rscript scripts/run_stage.R stress "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Run aggregate
        run: Rscript scripts/run_stage.R aggregate "$SHARD" smoke "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          path: artifacts/ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  plan:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - id: matrix
        run: echo "matrix=$(Rscript scripts/actions_matrix.R github_actions)" >> "$GITHUB_OUTPUT"

  backup-preflight:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      T2_BACKUP_HOST: ${{ vars.T2_BACKUP_HOST }}
      T2_BACKUP_USER: ${{ vars.T2_BACKUP_USER }}
      T2_BACKUP_ROOT: ${{ vars.T2_BACKUP_ROOT }}
      T2_BACKUP_SSH_KEY: ${{ secrets.T2_BACKUP_SSH_KEY }}
      T2_BACKUP_KNOWN_HOSTS: ${{ secrets.T2_BACKUP_KNOWN_HOSTS }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Require backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in T2_BACKUP_HOST T2_BACKUP_USER T2_BACKUP_ROOT T2_BACKUP_SSH_KEY T2_BACKUP_KNOWN_HOSTS TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            [[ -n "${!name:-}" ]] || { echo "Missing Actions backup setting: $name" >&2; exit 2; }
          done
          [[ "$T2_BACKUP_ROOT" == /* && "$T2_BACKUP_ROOT" != *..* ]] || { echo "Invalid T2_BACKUP_ROOT" >&2; exit 2; }
          echo "BACKUP PREFLIGHT PASS: cloud jobs have a configured local-backup route"

  full:
    needs: [preflight, plan, backup-preflight]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      T2_RESUME: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && '1' || '0' }}
      SHARD: ${{ matrix.family }}_${{ matrix.engine }}_seed${{ matrix.seed }}
      T2_OUTPUT_ROOT: artifacts/ci
      T2_BACKUP_HOST: ${{ vars.T2_BACKUP_HOST }}
      T2_BACKUP_USER: ${{ vars.T2_BACKUP_USER }}
      T2_BACKUP_ROOT: ${{ vars.T2_BACKUP_ROOT }}
      T2_BACKUP_SSH_KEY: ${{ secrets.T2_BACKUP_SSH_KEY }}
      T2_BACKUP_KNOWN_HOSTS: ${{ secrets.T2_BACKUP_KNOWN_HOSTS }}
      T2_CHECKPOINT_TRANSFER_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
      - name: Connect runner to private backup network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure verified SSH backup endpoint
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$T2_BACKUP_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$T2_BACKUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$T2_BACKUP_USER@$T2_BACKUP_HOST" true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - run: Rscript scripts/check_environment.R
      - name: Restore prior shard artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v5
        with:
          name: full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci/
      - name: Restore newest verified local-backup snapshot
        if: env.T2_RESUME == '1'
        continue-on-error: true
        shell: bash
        run: |
          T2_OUTPUT_ROOT=artifacts/ci scripts/checkpoint_transfer.sh pull "$SHARD" || \
            echo "No usable local snapshot; continuing with Actions artifact recovery"
      - name: Start checkpoint backup loop
        shell: bash
        run: |
          nohup scripts/checkpoint_sync_loop.sh "$SHARD" > checkpoint-sync.log 2>&1 &
          echo $! > checkpoint-sync.pid
      - name: Run datasets
        run: Rscript scripts/run_stage.R datasets "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run mc_validation
        run: Rscript scripts/run_stage.R mc_validation "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run montecarlo
        run: Rscript scripts/run_stage.R montecarlo "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run discovery
        run: Rscript scripts/run_stage.R discovery "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run heldout
        run: Rscript scripts/run_stage.R heldout "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run realworld
        run: Rscript scripts/run_stage.R realworld "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run stress
        run: Rscript scripts/run_stage.R stress "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}"
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Run aggregate
        run: Rscript scripts/run_stage.R aggregate "$SHARD" full "${{ matrix.family }}" "${{ matrix.seed }}" "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.family }}-${{ matrix.engine }}-${{ matrix.seed }}
          path: artifacts/ci/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Stop checkpoint backup loop and publish final snapshot
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f checkpoint-sync.pid ]]; then
            kill "$(cat checkpoint-sync.pid)" 2>/dev/null || true
            wait "$(cat checkpoint-sync.pid)" 2>/dev/null || true
          fi
          scripts/checkpoint_transfer.sh push "$SHARD" || echo "Final backup transfer failed; inspect checkpoint-sync.log"
          rm -f checkpoint-sync.pid
