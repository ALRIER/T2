name: T2 V3 Discovery Candidate Report
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/v3-discovery-candidate-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: t2-v3-discovery-*
          merge-multiple: true
          path: artifacts/discovery_v3
          run-id: 40132811105
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate exploratory Discovery candidate metrics
        run: bash scripts/run_r_in_container.sh Rscript scripts/v3_discovery_winner_report.R
      - uses: actions/upload-artifact@v4
        with:
          name: t2-v3-discovery-candidate-report
          path: artifacts/discovery_analysis/
          retention-days: 90
