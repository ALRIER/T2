name: T2 V3 B3 Independent Production Bubble
on:
  workflow_dispatch:
    inputs:
      enable_large_runs:
        description: 'Type YES to dispatch costly independent scientific workflows'
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: T2_V3_B3_independent_production_bubble
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository contracts and explicit computational authorization
        env:
          APPROVAL: ${{ inputs.enable_large_runs }}
        run: |
          test "$APPROVAL" = YES
          python3 scripts/t2_v3_b3_nested_contract.py
          python3 scripts/t2_v3_b3_realworld_freeze_smoke.py
          python3 scripts/t2_v3_b3_taxonomy_ram_gate.py
      - name: Scientific provenance warning
        run: |
          echo 'Production weights used by existing Held-out/Stress and RealWorld are pinned to historical Discovery run 40132811105.'
          echo 'Nested CV refit generates new fold-specific W; promotion of final B3 W must be completed before confirmatory production.'
          echo 'This bubble dispatches upstream preparation only until an exact promoted-W reference is available.'
  discovery:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch independent Nested CV Discovery workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:'t2-v3-b3-discovery-cv5-refit.yml',
              ref:context.ref.replace('refs/heads/','')
            });
            core.info('Independent Discovery CV5 run dispatched.');
  realworld-collection:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch independent fresh Real World parent collection
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:'t2-v3-b3-realworld-recollect.yml',
              ref:context.ref.replace('refs/heads/','')
            });
            core.info('Independent fresh RealWorld parent collection dispatched.');
  heldout:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Guard against mixing historical W with new Discovery
        run: |
          echo 'BLOCKED: confirmatory Held-out requires promoted frozen B3 W from the new Discovery.'
          echo 'No invalid production run was launched.'
  stress:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Guard against mixing historical W with new Discovery
        run: |
          echo 'BLOCKED: confirmatory Stress requires promoted frozen B3 W from the new Discovery.'
          echo 'No invalid production run was launched.'
  realworld-scoring:
    needs: [discovery,realworld-collection,heldout,stress]
    runs-on: ubuntu-latest
    steps:
      - name: Guard on provenance and freshly frozen parent manifest
        run: |
          echo 'BLOCKED: external scoring must use promoted B3 W and a successful fresh B3 parent-collection run ID.'
          echo 'New independent datasets and model promotion are required before launch.'
