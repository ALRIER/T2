name: T2 portfolio final report repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-report-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      T2_PORTFOLIO_ROOT: artifacts/confirmatory_portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Install statistical dependency
        run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - name: Restore all 36 completed inference artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: t2-portfolio-inference-*
          merge-multiple: true
          path: artifacts/confirmatory_portfolio/inference/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '39827156010'
      - name: Check recovered inference files
        shell: bash
        run: |
          set -euo pipefail
          n=$(find artifacts/confirmatory_portfolio/inference -name estimator_region_taxonomy.csv | wc -l)
          test "$n" -eq 36 || { echo "Expected 36 inference tables; received $n"; exit 1; }
      - name: Produce corrected final report
        run: Rscript scripts/confirmatory_portfolio_generalization.R report
      - name: Publish final report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-portfolio-generalization-report-repaired
          path: artifacts/confirmatory_portfolio/report/
          if-no-files-found: error
          retention-days: 180
