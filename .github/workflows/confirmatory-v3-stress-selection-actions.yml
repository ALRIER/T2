name: T2 Confirmatory V3 — stress taxonomy from Actions artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VALIDATION_RUN_ID: '39707832846'
  INFERENCE_RUN_ID: '39763527346'
  T2_CONFIRMATORY_V3_ROOT: artifacts/confirmatory_v3
  T2_MC_INFERENCE_ROOT: artifacts/confirmatory_v2/inference
  T2_MATRIX_FORMAT: rds
  T2_MAX_FILE_MB: '25'
  T2_STRESS_SAMPLE_N: '1000'
  # Canonical validation blocks were generated with 500 replicates.
  T2_STRESS_REPS: '500'

jobs:
  artifact-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify retained upstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          validation=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}/artifacts?per_page=100" --jq '.artifacts | length')
          inference=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INFERENCE_RUN_ID}/artifacts?per_page=100" --jq '.artifacts | length')
          test "$validation" -ge 36
          test "$inference" -ge 42

  stress-score:
    needs: artifact-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
        validation_seed: [21, 22, 23, 24, 25, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - name: Restore locked validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: validation-${{ matrix.family }}-seed-${{ matrix.validation_seed }}
          FAMILY: ${{ matrix.family }}
          VALIDATION_SEED: ${{ matrix.validation_seed }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == env.ARTIFACT_NAME) | .id")
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/validation.zip
          unzip -q /tmp/validation.zip -d .
          expected="artifacts/mc_canonical/v2_shared_base_crn/full/${FAMILY}/seed${VALIDATION_SEED}"
          if [[ ! -f "${expected}/n1000_r500.rds" ]]; then
            candidate=$(find . -type f -path "*/seed${VALIDATION_SEED}/n1000_r500.rds" -print -quit)
            test -n "$candidate"
            source_dir=$(dirname "$candidate")
            mkdir -p "$(dirname "$expected")"
            mv "$source_dir" "$expected"
          fi
          test -f "${expected}/n1000_r500.rds"
      - run: Rscript scripts/confirmatory_v3_existing_data.R stress_score "${{ matrix.family }}" "${{ matrix.validation_seed }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confirmatory-v3-stress-${{ matrix.family }}-seed-${{ matrix.validation_seed }}
          path: artifacts/confirmatory_v3/stress/${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 90

  stress-inference:
    needs: stress-score
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - uses: actions/download-artifact@v5
        with:
          pattern: confirmatory-v3-stress-${{ matrix.family }}-seed-*
          merge-multiple: true
          path: artifacts/confirmatory_v3/stress/${{ matrix.family }}/
      - run: Rscript scripts/confirmatory_v3_existing_data.R stress_inference "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        with:
          name: confirmatory-v3-stress-inference-${{ matrix.family }}
          path: artifacts/confirmatory_v3/stress_inference/${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 180

  freeze-complete-taxonomy:
    needs: stress-inference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - uses: actions/download-artifact@v5
        with:
          pattern: confirmatory-v3-stress-inference-*
          merge-multiple: true
          path: artifacts/confirmatory_v3/stress_inference/
      - name: Restore completed Monte Carlo inference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for family in normal lognormal weibull invgauss exgaussian exwald; do
            artifact="confirmatory-v2-inference-${family}"
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INFERENCE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"${artifact}\") | .id")
            test -n "$artifact_id"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "/tmp/${artifact}.zip"
            unzip -q "/tmp/${artifact}.zip" -d .
          done
      - run: Rscript scripts/confirmatory_v3_existing_data.R taxonomy_manifest
      - uses: actions/upload-artifact@v4
        with:
          name: t2-complete-realworld-taxonomy
          path: artifacts/confirmatory_v3/taxonomy_manifest/
          if-no-files-found: error
          retention-days: 180
