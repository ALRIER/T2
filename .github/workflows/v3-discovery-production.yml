name: T2 V3 Discovery Production 60
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/v3-discovery-production.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: t2-v3-discovery-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.origin.outputs.run_id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve successful immutable V3 production source
        id: origin
        uses: actions/github-script@v7
        with:
          script: |
            const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{
              owner:context.repo.owner,repo:context.repo.repo,branch:'t2-hpo-redesign-v1',per_page:100
            });
            const src=runs.find(r=>r.name==='T2 V3 - Monte Carlo Production Only' &&
              r.conclusion==='success' && r.head_sha?.startsWith('5f234b0'));
            if(!src) return core.setFailed('Expected completed immutable V3 Monte Carlo run missing');
            const a=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:src.id,per_page:100});
            const fam=['normal','lognormal','weibull','invgauss','exgaussian','exwald'];
            const expected=fam.flatMap(f=>Array.from({length:10},(_,i)=>`mc-v3-discovery-${f}-seed${i}-n1000`));
            const found=new Set(a.filter(x=>!x.expired).map(x=>x.name));
            const missing=expected.filter(x=>!found.has(x));
            if(missing.length) return core.setFailed('Missing discovery partitions: '+missing.join(', '));
            core.setOutput('run_id',String(src.id));
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=[dict(family=f,seed=s) for f in ['normal','lognormal','weibull','invgauss','exgaussian','exwald'] for s in range(10)]
          assert len(x)==60
          print('matrix='+json.dumps({'include':x},separators=(',',':')))
          PY
  discovery:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: mc-v3-discovery-${{ matrix.family }}-seed${{ matrix.seed }}-n1000
          path: artifacts/mc_v3_real26
          run-id: ${{ needs.plan.outputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Full V3 discovery (four optimizers, 121 scientific scenarios)
        env:
          FAMILY: ${{ matrix.family }}
          SEED: ${{ matrix.seed }}
        run: bash scripts/run_r_in_container.sh Rscript scripts/v3_discovery_production.R "$FAMILY" "$SEED"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-v3-discovery-${{ matrix.family }}-seed${{ matrix.seed }}
          path: artifacts/discovery_v3/
          retention-days: 90
          if-no-files-found: error
