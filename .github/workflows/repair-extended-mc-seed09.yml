name: Repair extended Monte Carlo seed 09 uploads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
    env:
      T2_CANONICAL_MC_ROOT: artifacts/mc_canonical
      T2_MC_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/montecarlo-seeds-09-20
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - run: Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/statmod_1.5.2.tar.gz", repos=NULL, type="source")'
      - run: Rscript scripts/check_environment.R
      - run: Rscript tools/extended_mc.R "${{ matrix.family }}" 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-mc-repair-${{ matrix.family }}-seed-9
          path: artifacts/mc_canonical/v2_shared_base_crn/full/${{ matrix.family }}/seed09/
          if-no-files-found: error
          retention-days: 90
