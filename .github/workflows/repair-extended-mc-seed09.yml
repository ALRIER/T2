name: Repair extended Monte Carlo seed 09 uploads

on:
  workflow_dispatch:

permissions:
  packages: read
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
    env:
      T2_CANONICAL_MC_ROOT: artifacts/mc_canonical
      T2_MC_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        with:
          ref: experiment/montecarlo-seeds-09-20
      - run: bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R
      - run: bash scripts/run_r_in_container.sh Rscript tools/extended_mc.R "${{ matrix.family }}" 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-mc-repair-${{ matrix.family }}-seed-9
          path: artifacts/mc_canonical/v2_shared_base_crn/full/${{ matrix.family }}/seed09/
          if-no-files-found: error
          retention-days: 90
