name: T2 scientific scenario artifacts from completed validation

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: 'Completed Actions run containing validation-family canonical RDS artifacts'
        required: true
        type: string
      r_runtime_image:
        description: 'Pinned R image (image@sha256:...)'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  publish-scientific-scenarios:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.r_runtime_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        family: [normal, lognormal, weibull, invgauss, exgaussian, exwald]
        seed: [21, 22, 23, 24, 25, 26]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: Rscript scripts/check_environment.R
      - name: Download one original canonical family-seed artifact
        uses: actions/download-artifact@v5
        with:
          name: validation-${{ matrix.family }}-seed-${{ matrix.seed }}
          path: /tmp/scientific-source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
      - name: Extract and convert selected scientific scenarios
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find /tmp/scientific-source -type f -name 'n1000_r500.rds')
          if [[ "${#candidates[@]}" != 1 ]]; then
            echo "Expected exactly one canonical RDS" >&2
            exit 1
          fi
          target="artifacts/mc_canonical/v2_shared_base_crn/full/${FAMILY}/seed${SEED}"
          mkdir -p "$target"
          cp "${candidates[0]}" "$target/n1000_r500.rds"
          Rscript scripts/build_scenario_store.R "$FAMILY" "$SEED" 1000 500 heldout
          rm -rf /tmp/scientific-source
          rm -f "$target/n1000_r500.rds"
      - name: Publish verified scientific scenario artifact
        uses: actions/upload-artifact@v4
        with:
          name: t2-t-heldout-${{ matrix.family }}-seed-${{ matrix.seed }}
          path: artifacts/mc_canonical/v2_shared_base_crn/full/${{ matrix.family }}/seed${{ matrix.seed }}/n1000_r500.rds.scenarios/
          if-no-files-found: error
          retention-days: 90
