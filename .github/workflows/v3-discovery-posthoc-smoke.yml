name: T2 V3 Discovery Posthoc Audit Smoke
on:
  push:
    branches: [t2-v3-contract-adapter-20261024]
    paths: ['.github/workflows/v3-discovery-posthoc-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          name: t2-v3-discovery-normal-seed0
          run-id: 40132811105
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/discovery_v3
      - uses: actions/download-artifact@v5
        with:
          name: mc-v3-discovery-normal-seed0-n1000
          run-id: 40053612297
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: artifacts/mc_v3_real26
      - run: bash scripts/run_r_in_container.sh Rscript scripts/v3_discovery_posthoc_audit.R normal 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-v3-discovery-posthoc-smoke
          path: artifacts/discovery_posthoc_v3
          if-no-files-found: warn
