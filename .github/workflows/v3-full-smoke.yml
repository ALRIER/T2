name: "T2 V3 - Full Preflight and Benchmark" # numerical diagnostics and capacity v3
on:
  workflow_dispatch:
  push:
    branches: [t2-hpo-redesign-v1]
    paths:
      - '.github/workflows/v3-full-smoke.yml'
      - 'scripts/v3_full_smoke.R'
permissions:
  contents: read
  packages: read
jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      T2_MC_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare diagnostics
        run: mkdir -p artifacts/v3_full_smoke
      - name: Verify Docker image and runtime
        run: |
          docker version > artifacts/v3_full_smoke/docker_version.txt
          bash scripts/run_r_in_container.sh Rscript scripts/check_environment.R 2>&1 | tee artifacts/v3_full_smoke/environment.log
      - name: Contract and estimator tests
        run: |
          set -o pipefail
          for test in tests/test_v3_no_legacy_calls.R tests/test_v3_seed_plan.R tests/test_revised_estimator_library.R tests/test_v3_generator_contract.R tests/test_v3_heldout_q95.R; do
            bash scripts/run_r_in_container.sh Rscript "$test" 2>&1 | tee -a artifacts/v3_full_smoke/contracts.log
          done
      - name: Full three-stage smoke and checkpoint recovery
        run: |
          set -o pipefail
          docker run --rm --entrypoint /bin/sh ghcr.io/alrier/t2-r:4.3.3-statmod-v1 -c 'command -v /usr/bin/time || true' > artifacts/v3_full_smoke/container_time_check.txt
          set +e
          docker stats --no-stream > artifacts/v3_full_smoke/docker_stats_baseline.txt
          set -e
          docker run --name t2-v3-full-smoke --rm -v "$PWD:/workspace" -w /workspace ghcr.io/alrier/t2-r:4.3.3-statmod-v1 /bin/sh -c 'Rscript scripts/v3_full_smoke.R; code=$?; cat /sys/fs/cgroup/memory.peak > artifacts/v3_full_smoke/smoke_memory_peak_bytes.txt 2>/dev/null || true; exit "$code"' > artifacts/v3_full_smoke/smoke.log 2>&1 &
          pid=$!
          (
            while kill -0 "$pid" 2>/dev/null; do
              docker stats --no-stream --format '{{.Name}},{{.CPUPerc}},{{.MemUsage}},{{.MemPerc}}' t2-v3-full-smoke >> artifacts/v3_full_smoke/container_stats.csv 2>/dev/null || true
              sleep 0.25
            done
          ) &
          monitor=$!
          wait "$pid"
          status=$?
          wait "$monitor" || true
          cat artifacts/v3_full_smoke/smoke.log
          exit "$status"
      - name: Representative load benchmark, 500 replicates
        run: |
          set -euo pipefail
          docker run --name t2-v3-load --rm -v "$PWD:/workspace" -w /workspace ghcr.io/alrier/t2-r:4.3.3-statmod-v1 /bin/sh -c 'Rscript scripts/v3_capacity_probe.R; code=$?; cat /sys/fs/cgroup/memory.peak > artifacts/v3_full_smoke/capacity_memory_peak_bytes.txt 2>/dev/null || true; exit "$code"' > artifacts/v3_full_smoke/capacity.log 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            docker stats --no-stream --format '{{.Name}},{{.CPUPerc}},{{.MemUsage}},{{.MemPerc}}' t2-v3-load >> artifacts/v3_full_smoke/capacity_container_stats.csv 2>/dev/null || true
            sleep 0.5
          done
          wait "$pid"
          cat artifacts/v3_full_smoke/capacity.log
      - name: Backup export, SHA256 and restore verification
        run: |
          set -euo pipefail
          cd artifacts/v3_full_smoke
          tar -czf v3_smoke_backup.tar.gz data
          find data -type f -print0 | sort -z | xargs -0 sha256sum > integrity_manifest.sha256
          mkdir restored
          tar -xzf v3_smoke_backup.tar.gz -C restored
          (cd restored && sha256sum -c ../integrity_manifest.sha256) > restore_verification.log
          printf '{"backup":"PASS","sha256":"PASS","restore":"PASS"}\n' > backup_report.json
          du -sh data v3_smoke_backup.tar.gz > storage.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo '## T2 V3 Full Smoke'
            echo 'Successful phases report PASS; failed steps stop the run.'
            if test -f artifacts/v3_full_smoke/smoke_report.json; then cat artifacts/v3_full_smoke/smoke_report.json; fi
            if test -f artifacts/v3_full_smoke/backup_report.json; then cat artifacts/v3_full_smoke/backup_report.json; fi
            if test -f artifacts/v3_full_smoke/storage.txt; then cat artifacts/v3_full_smoke/storage.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2-v3-full-smoke-diagnostics-${{ github.run_id }}
          path: artifacts/v3_full_smoke/
          retention-days: 30
          if-no-files-found: warn
